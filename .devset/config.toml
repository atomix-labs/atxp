# devset applies the profiles below to this directory, and keeps them up to date.
# The manual: https://atomix-labs.github.io/devset/
#
# Where profiles come from, each named once: a git repository at a ref, or a directory.
#
#   [sources]
#   atxp = { git = "https://github.com/atomix-labs/atxp", tag = "v0.4.0" }
#
# The profiles to apply, in order, by source and name, with the features to turn on.
#
#   [[layers]]
#   profile  = "atxp/rust"
#   features = ["docs"]

[sources]
atxp = { path = "profiles" }

[[layers]]
profile = "atxp/editorconfig"

[[layers]]
profile = "atxp/git-attributes"

[[layers]]
profile = "atxp/git-ignore"

[[layers]]
profile = "atxp/mise"

[[layers]]
profile = "atxp/just"

[[layers]]
profile = "atxp/setup"

[[layers]]
profile = "atxp/github-ci"

[[layers]]
profile = "atxp/github-watch"

[[layers]]
profile = "atxp/github-bump"

[[layers]]
profile = "atxp/github-dependabot"

[[layers]]
profile = "atxp/git-commits"

[[layers]]
profile = "atxp/git-changelog"

[[layers]]
profile = "atxp/spelling"

[[layers]]
profile = "atxp/toml"

[[layers]]
profile = "atxp/dprint"

[[layers]]
profile = "atxp/markdown"

[[layers]]
profile = "atxp/python"

[[layers]]
profile = "atxp/yaml"

[[layers]]
profile = "atxp/shell"

[[layers]]
profile = "atxp/github-workflow-lint"

[[layers]]
profile = "atxp/suppressions"

[[layers]]
profile = "atxp/github-release"

[[layers]]
profile = "atxp/devset"

[[layers]]
profile = "atxp/devset-collection"
features = ["pins"]
