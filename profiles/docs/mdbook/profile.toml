[profile]
name        = "mdbook"
description = "mdBook: the book scaffolded, built, tested and linted, with math, diagrams and the API"
devset      = ">=0.2.2"

[requires]
github-ci      = { optional = true }
lychee         = { optional = true }
rust-toolchain = {}

[features]
default = ["katex", "api", "pages", "links"]
# Math, rendered at build time by mdbook-katex, its stylesheet and fonts vendored.
katex = []
# Diagrams, drawn by mermaid, vendored.
mermaid = []
# The workspace's rustdoc at /api, with rustdoc's index page, linked from the menu bar.
api = []
# The book on GitHub Pages: github-ci's pages jobs, and the pages keys of .github/automation.json.
pages = ["github-ci?/pages"]
# lychee over the built book.
links = ["dep:lychee"]

[vars.book_dir]
prompt  = "Directory of the mdBook, its book.toml"
default = "docs"

[vars.repository]
prompt = "The GitHub repository, owner/name"

[scaffolds.book]
unless = "{{ book_dir }}/book.toml"

[files."{{ book_dir }}/book.toml"]
scope    = "keys"
policy   = "merge"
starter  = "book.starter.toml"
template = true

[files."{{ book_dir }}/src/SUMMARY.md"]
scaffold = "book"

[files."{{ book_dir }}/src/introduction.md"]
scaffold = "book"

[files."{{ book_dir }}/src/getting-started.md"]
scaffold = "book"

[files."{{ book_dir }}/theme/width.css"]
policy = "merge"

[files."{{ book_dir }}/theme/details.css"]
policy = "merge"

[files."{{ book_dir }}/theme/prompt.css"]
policy = "merge"

[files."{{ book_dir }}/README.md"]
scaffold = "book"

[files."{{ book_dir }}/vendor/katex/katex.min.css"]
when = { features = ["katex"] }

[files."{{ book_dir }}/vendor/katex/README.md"]
when = { features = ["katex"] }

[files."{{ book_dir }}/src/vendor/katex/fonts/KaTeX_AMS-Regular.woff2"]
