[profile]
name        = "rust-fmt"
description = "rustfmt on nightly options: imports by module, comments wrapped, doc examples formatted"
devset      = ">=0.2.1"

[requires]
rust-toolchain = {}

[vars.line_width]
prompt  = "Line width, shared by the formatters and EditorConfig"
default = "100"

[files."rustfmt.toml"]
scope    = "keys"
policy   = "merge"
template = true

[files.".just/rust-fmt.just"]
