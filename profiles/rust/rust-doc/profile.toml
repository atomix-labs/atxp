[profile]
name        = "rust-doc"
description = "rustdoc builds every crate's documentation, private items included, warnings denied"
devset      = ">=0.3.0"

[requires]
rust-toolchain = {}

[features]
# The house's doc lint, in check-rust-doc.
strict = []
agents = []

[files.".just/rust-doc.just"]
template = true

[files.".just/rust-doc.py"]

[files.".claude/skills/writing-rustdoc/SKILL.md"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rustdoc/references/comments.md"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rustdoc/references/exemplars.md"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rustdoc/references/sources.md"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rustdoc/references/style.md"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rustdoc/references/templates.md"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rustdoc/references/tooling.md"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rustdoc/scripts/doc-audit.sh"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rustdoc/scripts/doc-inventory.py"]
when = { features = ["agents"] }
