[profile]
name        = "rust-lints"
description = "The lint wall, as keys of the workspace Cargo.toml: rustc, rustdoc, clippy and cargo, and nightly's own lints"
devset      = ">=0.5.0"

[requires]
rust-toolchain = {}

[features]
# The writing-rust and writing-unsafe-rust skills, in .claude/skills/.
agents = []
# writing-rust's reference for async Rust on tokio.
async   = []
nightly = []
strict  = []

[files."Cargo.toml"]
scope    = "keys"
template = true

[files.".just/rust-lints.just"]
when = { features = ["nightly"] }

[files.".claude/skills/writing-rust/SKILL.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust/references/api-design.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust/references/async.md"]
when = { features = ["agents", "async"] }

[files.".claude/skills/writing-rust/references/errors.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust/references/layout.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust/references/lints.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust/references/naming.md"]
when = { features = ["agents"] }

[files.".claude/skills/writing-rust/references/ownership.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust/references/sources.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-unsafe-rust/SKILL.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-unsafe-rust/references/atomics.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-unsafe-rust/references/pointers.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-unsafe-rust/references/safety-comments.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-unsafe-rust/references/sources.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-unsafe-rust/references/verifying.md"]
template = true
when     = { features = ["agents"] }
