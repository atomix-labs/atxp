[profile]
name        = "rust-toolchain"
description = "The toolchain a checkout builds with: rustup where missing, then one pinned nightly with miri, rustc-dev, llvm-tools and the sources"
devset      = ">=0.2.2"

[requires]
just = {}
mise = {}

[vars.channel]
prompt  = "The toolchain: nightly, the one the profiles pin, or stable"
default = "nightly"

[files."rust-toolchain.toml"]
scope    = "keys"
template = true

[files.".just/rust-toolchain.just"]

[files.".just/rust-toolchain.sh"]
executable = true

[files.".config/mise/conf.d/devset-rust-toolchain.toml"]
