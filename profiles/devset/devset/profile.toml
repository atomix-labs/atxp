[profile]
name        = "devset"
description = "devset itself: pinned for every machine and job, and drift from the profiles failing the checks"
devset      = ">=0.2.2"

[features]
# The using-devset skill, in .claude/skills/.
agents = []

[requires]
mise = {}

[files.".just/devset.just"]

[files.".just/devset.py"]

[files.".config/mise/conf.d/devset-devset.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"

[files.".claude/skills/using-devset/SKILL.md"]
when = { features = ["agents"] }
