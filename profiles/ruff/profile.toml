[profile]
name        = "ruff"
description = "Ruff lints Python at the shared line width; formatting is dprint's, through its Ruff plugin"
devset      = ">=0.1"

[vars.line_width]
prompt  = "Line width, shared by the formatters and EditorConfig"
default = "100"

[files."ruff.toml"]
scope    = "keys"
policy   = "merge"
template = true

[files.".just/ruff.just"]

[files.".config/mise/conf.d/devset-ruff.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"
