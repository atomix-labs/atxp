[profile]
name        = "setup"
description = "One command readies a machine for a checkout: mise, pinned and verified, then mise bootstrap and just setup"
devset      = ">=0.5.0"

[requires]
just = {}
mise = {}

[features]
default      = []
devcontainer = []

[vars.repository]
prompt = "The GitHub repository, owner/name"

[files."setup.sh"]
executable = true

[files.".config/mise/conf.d/devset-setup.toml"]

[files.".devcontainer/devcontainer.json"]
policy   = "once"
template = true
when     = { features = ["devcontainer"] }

[files."CONTRIBUTING.md"]
scope    = "block"
template = true
when     = { exists = ["CONTRIBUTING.md"] }
