[profile]
name        = "editorconfig"
description = "EditorConfig: UTF-8, LF, a final newline, spaces, and the shared line width"
devset      = ">=0.1"

[vars.line_width]
prompt  = "Line width, shared by the formatters and EditorConfig"
default = "100"

[files.".editorconfig"]
policy   = "merge"
template = true
