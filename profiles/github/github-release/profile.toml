[profile]
name        = "github-release"
description = "A release from its tag: every package-* recipe on each platform, then the GitHub Release with git-cliff's notes"
devset      = ">=0.3.0"

[requires]
git-changelog = {}
just          = {}

[features]
# The cutting-releases skill, in .claude/skills/.
agents = []

[vars.repository]
prompt = "The GitHub repository, owner/name"

[scaffolds.release]
unless = "RELEASE.md"

[files."RELEASE.md"]
scaffold = "release"
template = true

[files.".github/workflows/release.yml"]
template = true

[files.".claude/skills/cutting-releases/SKILL.md"]
template = true
when     = { features = ["agents"] }
