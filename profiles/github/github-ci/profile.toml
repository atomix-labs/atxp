[profile]
name        = "github-ci"
description = "GitHub Actions: every `check-*` recipe a job of its own, read from the justfile, tools from the mise lock; with pages, a site built once and deployed"
devset      = ">=0.2.2"

[requires]
github-automation = {}
just              = {}

[features]
default = []
# The site one recipe builds, kept from each run and deployed to GitHub Pages from the default
# branch.
pages = []
# The fixing-ci skill, in .claude/skills/.
agents = []

[files.".github/workflows/check.yml"]
template = true

[files.".claude/skills/fixing-ci/SKILL.md"]
when = { features = ["agents"] }
