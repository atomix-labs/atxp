{%- set logins = assignees | split(",") | map("trim") | select | list -%}
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
    # Labels github-labels keeps: without them, Dependabot makes labels of its own.
    labels: [dependencies, automation]
{%- if logins %}
    assignees: ["{{ logins | join('", "') }}"]
{%- endif %}
