[profile]
name        = "github-bump"
description = "A weekly bump: every `bump-*` recipe, gated by `just check`, to a signed commit, a PR or a merge"
devset      = ">=0.4.0"

[requires]
github-automation = {}
github-watch      = {}
just              = {}

[features]
# Merges the bump's pull request once `just check` passes: github-automation writes `bump.merge`
# in .github/automation.json where it is on. Off unless a repository turns it on.
merge = []

[files.".github/workflows/bump.yml"]

[files.".github/scripts/bump.js"]
