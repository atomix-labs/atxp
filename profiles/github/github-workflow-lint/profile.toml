[profile]
name        = "github-workflow-lint"
description = "actionlint checks every GitHub Actions workflow: syntax, expressions, and the shell in each step"
devset      = ">=0.2"

[vars.runner_labels]
prompt  = "Self-hosted runner labels actionlint accepts, comma-separated"
default = ""

[files.".github/actionlint.yaml"]
template = true

[files.".just/github-workflow-lint.just"]

[files.".config/mise/conf.d/devset-github-workflow-lint.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"
