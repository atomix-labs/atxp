[profile]
name        = "github-templates"
description = "GitHub's issue forms and pull request checklist, the repository's once written"
devset      = ">=0.5.0"

[vars.repository]
prompt = "The GitHub repository, owner/name"

[files.".github/ISSUE_TEMPLATE/bug_report.yml"]
policy = "once"

[files.".github/ISSUE_TEMPLATE/feature_request.yml"]
policy = "once"

[files.".github/ISSUE_TEMPLATE/config.yml"]
policy   = "once"
template = true

[files.".github/pull_request_template.md"]
policy   = "once"
template = true
