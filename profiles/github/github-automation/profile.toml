[profile]
name        = "github-automation"
description = "The automation's settings and helpers: labels and types, who is assigned, how far the bump goes"
devset      = ">=0.5.0"

[vars.assignees]
prompt  = "GitHub logins assigned the automation's issues and pull requests, comma-separated"
default = ""

[vars.bump_mode]
prompt  = "How far the weekly bump goes: branch, or pr to open a pull request"
default = "pr"

[files.".github/automation.json"]
scope    = "keys"
policy   = "merge"
template = true

[files.".github/scripts/automation.js"]
