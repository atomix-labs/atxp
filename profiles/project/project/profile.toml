[profile]
name        = "project"
description = "The documents every project keeps: the README, the licence, how to contribute, security, breaking changes"
devset      = ">=0.5.0"

[features]
default          = ["readme", "license", "contributing", "security", "breaking-changes"]
readme           = []
license          = []
contributing     = []
security         = []
breaking-changes = ["git-changelog?/breaking-changes"]
conduct          = []
# A SUPPORT.md, which GitHub links beside a new issue: where to ask, report, and disclose.
support      = []
architecture = []
# "managed with devset" among the header's badges, linking devset.
devset-badge = []

[requires]
git-changelog = { optional = true }

[vars.name]
prompt  = "The project's name, and its first crate's; empty takes the directory's"
default = ""

[vars.crate]
prompt  = "The crate the crates.io and docs.rs badges show; empty takes the project's name"
default = ""

[vars.description]
prompt  = "One line: what the project is"
default = ""

[vars.logo]
prompt  = "The README's logo: its path or URL before `-light.svg` or `-dark.svg`"
default = ""

[vars.authors]
prompt  = "Authors, comma-separated"
default = ""

[vars.license]
prompt  = "The licence, an SPDX expression"
default = "MIT OR Apache-2.0"

[vars.repository]
prompt = "The GitHub repository, owner/name"

[vars.conduct_contact]
prompt  = "Where conduct is reported privately, an email address or URL; empty sends it through GitHub's Report content"
default = ""

[files."README.md"]
scope    = "block"
starter  = "README.starter.md"
template = true
when     = { features = ["readme"] }

[files."CONTRIBUTING.md"]
scope   = "block"
starter = "CONTRIBUTING.starter.md"
when    = { features = ["contributing"] }

[files."LICENSE-MIT"]
policy   = "once"
template = true
when     = { features = ["license"], vars = { license = ["MIT OR Apache-2.0"] } }

[files."LICENSE-APACHE"]
policy = "once"
when   = { features = ["license"], vars = { license = ["MIT OR Apache-2.0"] } }

[files."LICENSE"]
policy   = "once"
template = true
when     = { features = ["license"], vars = { license = ["MIT", "Apache-2.0"] } }

[files."SECURITY.md"]
policy   = "once"
template = true
when     = { features = ["security"] }

[files."BREAKING-CHANGES.md"]
policy   = "once"
template = true
when     = { features = ["breaking-changes"] }

[files."CODE_OF_CONDUCT.md"]
policy   = "once"
template = true
when     = { features = ["conduct"] }

[files."SUPPORT.md"]
policy   = "once"
template = true
when     = { features = ["support"] }

[files."ARCHITECTURE.md"]
policy = "once"
when   = { features = ["architecture"] }
