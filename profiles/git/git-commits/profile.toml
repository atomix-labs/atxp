[profile]
name        = "git-commits"
description = "committed holds what lands to Conventional Commits: a pull request's title, which its squashed commit takes, and a branch's commits"
devset      = ">=0.5.0"

[features]
# The commit rules, in a block of AGENTS.md where the repository has one.
agents = []

[files."committed.toml"]

[files.".just/git-commits.just"]

[files.".github/workflows/title.yml"]
when = { profiles = ["github-ci"] }

[files.".config/mise/conf.d/devset-git-commits.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"

[files."CONTRIBUTING.md"]
scope = "block"
when  = { exists = ["CONTRIBUTING.md"] }

[files."AGENTS.md"]
scope = "block"
when  = { features = ["agents"], exists = ["AGENTS.md"] }
