# The house formats its crate manifests; every other TOML file is written by the tool that reads it.
include = ["**/Cargo.toml"]

[formatting]
align_entries         = true
align_comments        = true
array_trailing_comma  = true
array_auto_expand     = false
array_auto_collapse   = true
compact_arrays        = true
compact_inline_tables = false
compact_entries       = false
indent_tables         = false
indent_entries        = false
indent_string         = "    "
inline_table_expand   = false
trailing_newline      = true
reorder_keys          = false
reorder_arrays        = false
allowed_blank_lines   = 1

# Alphabetize entries within dependency tables. Blank lines are
# barriers, so `# external` / `# internal` groups are preserved.
[[rule]]
include = ["**/Cargo.toml"]
keys = ["dependencies", "dev-dependencies", "build-dependencies", "workspace.dependencies"]
[rule.formatting]
reorder_keys = true
