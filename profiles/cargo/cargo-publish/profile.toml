[profile]
name        = "cargo-publish"
description = "crates.io: every crate a release publishes packaged on each change, and published at the release by trusted publishing"
devset      = ">=0.5.0"

[requires]
just           = {}
rust-toolchain = {}

[vars.repository]
prompt = "The GitHub repository, owner/name"

[files.".just/cargo-publish.just"]
template = true

[files.".just/cargo-publish.py"]

[files.".just/cargo-publish/categories.txt"]
