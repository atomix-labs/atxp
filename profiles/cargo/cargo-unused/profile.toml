[profile]
name        = "cargo-unused"
description = "Dependencies no crate uses, found by cargo-machete from the sources and cargo-shear from the compiled graph"
devset      = ">=0.3.0"

[requires]
rust-toolchain = {}

[features]
default = ["machete", "shear"]
machete = []
shear   = []

[files.".just/cargo-unused.just"]
template = true

[files.".config/mise/conf.d/devset-cargo-unused.toml"]
template = true

[files.".config/mise/mise.lock"]
scope    = "keys"
template = true
