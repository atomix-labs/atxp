[tools]
{% if "machete" in devset.features %}
# Built with cargo: its Linux arm64 release needs a newer glibc than many distributions carry.
"cargo:cargo-machete" = "0.9.2"
{% endif %}
{% if "shear" in devset.features %}
# Built with cargo: the musl release takes an asset pattern per platform, which mise's lock does not
# keep.
"cargo:cargo-shear" = "1.13.4"
{% endif %}
