[profile]
name        = "cargo-deny"
description = "cargo-deny: yanked and unmaintained crates, one version each, permissive licences, crates.io only, and the house bans"
devset      = ">=0.2.1"

[requires]
rust-toolchain = {}

[features]
strict = []

[files."deny.toml"]
scope    = "keys"
template = true

[files.".just/cargo-deny.just"]

[files.".config/mise/conf.d/devset-cargo-deny.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"
