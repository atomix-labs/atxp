[profile]
name        = "cargo-deny"
description = "cargo-deny: yanked and unmaintained crates, one version each, permissive licences, crates.io only, and the house bans"
devset      = ">=0.3.0"

[requires]
rust-toolchain = {}

[features]
strict = []
# What a failure asks of the maintainer, in a block of AGENTS.md where the repository has one.
agents = []

[files."deny.toml"]
scope    = "keys"
template = true

[files.".just/cargo-deny.just"]

[files.".config/mise/conf.d/devset-cargo-deny.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"

[files."AGENTS.md"]
scope = "block"
when  = { features = ["agents"], exists = ["AGENTS.md"] }
