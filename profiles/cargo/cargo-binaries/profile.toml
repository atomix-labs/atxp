[profile]
name        = "cargo-binaries"
description = "A release's binaries: the workspace's, built for this machine, static on Linux, archived with a sha256"
devset      = ">=0.5.0"

[requires]
just           = {}
rust-toolchain = {}

[features]
# Each archive also holds the binary's shell completions, where it answers `<bin> completions
# <shell>`, as a clap_complete command does.
completions = []

[files.".just/cargo-binaries.just"]
template = true

[files.".just/cargo-binaries.sh"]
executable = true

[files.".gitignore"]
scope = "block"
