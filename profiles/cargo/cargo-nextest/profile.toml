[profile]
name        = "cargo-nextest"
description = "cargo-nextest for every test, and cargo for the doctests; in CI, a `ci` profile that runs them all"
devset      = ">=0.5.0"

[requires]
rust-toolchain = {}

[features]
# The writing-rust-tests skill, in .claude/skills/.
agents = []

[files.".config/nextest.toml"]
scope = "keys"

[files.".just/cargo-nextest.just"]

[files.".config/mise/conf.d/devset-cargo-nextest.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"

[files.".claude/skills/writing-rust-tests/SKILL.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust-tests/references/compile-fail.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust-tests/references/layout.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust-tests/references/properties.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust-tests/references/running.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust-tests/references/sources.md"]
template = true
when     = { features = ["agents"] }

[files.".claude/skills/writing-rust-tests/references/writing-tests.md"]
template = true
when     = { features = ["agents"] }
