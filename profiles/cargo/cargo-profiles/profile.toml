[profile]
name        = "cargo-profiles"
description = "Build profiles as keys of the workspace Cargo.toml: release, bench, dev, test, profiling and release-fast"
devset      = ">=0.2.2"

[features]
strict = []

[files."Cargo.toml"]
scope    = "keys"
template = true

[files.".gitignore"]
scope = "block"
