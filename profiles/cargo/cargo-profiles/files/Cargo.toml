[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
debug            = false
debug-assertions = false
overflow-checks  = false
panic            = "abort"
strip            = false
incremental      = false
rpath            = false

[profile.bench]
inherits      = "release"
lto           = "fat"
codegen-units = 1

[profile.dev]
opt-level        = 0
lto              = false
codegen-units    = 256
debug            = true
debug-assertions = true
overflow-checks  = true
panic            = "abort"
strip            = false
incremental      = true
rpath            = false

[profile.test]
inherits      = "dev"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits        = "release"
debug           = "full"
strip           = "none"
split-debuginfo = "packed"

[profile.release-fast]
inherits      = "release"
lto           = "thin"
codegen-units = 16
incremental   = true
