[profile]
name        = "dprint"
description = "dprint formats Markdown at 80, and YAML, JSON, Python, CSS and JavaScript; every plugin checksummed"
devset      = ">=0.1"

[vars.line_width]
prompt  = "Line width, shared by the formatters and EditorConfig"
default = "100"

[files."dprint.json"]
scope    = "keys"
policy   = "merge"
template = true

[files.".just/dprint.just"]

[files.".config/mise/conf.d/devset-dprint.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"
