[profile]
name        = "dprint"
description = "dprint, the formatter: JSON, CSS and JavaScript, and each language profile's plugin; every plugin checksummed"
devset      = ">=0.2.2"

[vars.line_width]
prompt  = "Line width, shared by the formatters and EditorConfig"
default = "100"

[files."dprint.json"]
scope    = "keys"
policy   = "merge"
template = true

[files.".just/dprint.just"]

[files.".config/mise/conf.d/devset-dprint.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"
