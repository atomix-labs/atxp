[profile]
name        = "markdown"
description = "Markdown: formatted by dprint at 80, and linted by rumdl, headings in title case"
devset      = ">=0.2.1"

[requires]
dprint = {}

[files.".rumdl.toml"]
scope  = "keys"
policy = "merge"

[files.".just/markdown.just"]

[files.".config/mise/conf.d/devset-markdown.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"

[files.".gitignore"]
scope = "block"

[files."dprint.json"]
scope  = "keys"
policy = "merge"
