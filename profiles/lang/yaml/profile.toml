[profile]
name        = "yaml"
description = "YAML: formatted by dprint with double quotes, and checked by yamllint for what no formatter fixes"
devset      = ">=0.2"

[requires]
dprint = {}

[files.".yamllint.yaml"]
scope  = "keys"
policy = "merge"

[files.".just/yaml.just"]

[files.".config/mise/conf.d/devset-yaml.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"

[files."dprint.json"]
scope  = "keys"
policy = "merge"
