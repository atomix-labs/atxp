[profile]
name        = "yaml"
description = "YAML: formatted by dprint with double quotes, and checked by yamllint for what no formatter fixes"
devset      = ">=0.3.0"

[requires]
dprint = { optional = true }
mise   = { optional = true }

[features]
default = ["format", "lint"]
# dprint formats every YAML file, with double quotes.
format = ["dep:dprint"]
# yamllint checks what no formatter fixes; its pipx install needs mise's uv and Python.
lint = ["dep:mise"]

[files.".yamllint.yaml"]
scope  = "keys"
policy = "merge"
when   = { features = ["lint"] }

[files.".just/yaml.just"]
when = { features = ["lint"] }

[files.".config/mise/conf.d/devset-yaml.toml"]
when = { features = ["lint"] }

[files.".config/mise/mise.lock"]
scope = "keys"
when  = { features = ["lint"] }

[files."dprint.json"]
scope  = "keys"
policy = "merge"
when   = { features = ["format"] }
