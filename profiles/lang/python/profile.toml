[profile]
name        = "python"
description = "Python: linted by Ruff at the shared line width, and formatted by dprint through its Ruff plugin"
devset      = ">=0.3.0"

[requires]
dprint = { optional = true }

[features]
default = ["lint", "format"]
# Ruff lints every Python file.
lint = []
# dprint formats every Python file, through its Ruff plugin.
format = ["dep:dprint"]

[vars.line_width]
prompt  = "Line width, shared by the formatters and EditorConfig"
default = "100"

[files."ruff.toml"]
scope    = "keys"
policy   = "merge"
template = true
when     = { features = ["lint"] }

[files.".just/python.just"]
when = { features = ["lint"] }

[files.".config/mise/conf.d/devset-python.toml"]
when = { features = ["lint"] }

[files.".config/mise/mise.lock"]
scope = "keys"
when  = { features = ["lint"] }

[files.".gitignore"]
scope = "block"

[files."dprint.json"]
scope  = "keys"
policy = "merge"
when   = { features = ["format"] }
