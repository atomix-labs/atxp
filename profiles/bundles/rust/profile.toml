[profile]
name        = "rust"
description = "A Rust repository: toolchain, formatting, lints, dependency policy, tests, commits, the changelog and CI"
devset      = ">=0.2.2"

[requires]
rust-toolchain       = {}
rust-fmt             = {}
rust-clippy          = {}
rust-lints           = {}
rust-doc             = {}
cargo-workspace      = {}
cargo-deny           = {}
cargo-unused         = {}
cargo-nextest        = {}
cargo-profiles       = {}
cargo-manifest       = {}
cargo-bump           = {}
git-ignore           = {}
git-attributes       = {}
git-commits          = {}
git-changelog        = {}
github-ci            = {}
github-bump          = {}
github-watch         = {}
github-dependabot    = {}
github-workflow-lint = {}
markdown             = {}
toml                 = {}
yaml                 = {}
spelling             = {}
shell                = {}
mise                 = {}
just                 = {}
setup                = {}
editorconfig         = {}
devset               = {}
mdbook               = { optional = true }
cargo-publish        = { optional = true }
github-release       = { optional = true }
cargo-binaries       = { optional = true }
cargo-hack           = { optional = true }
github-nightly       = { optional = true }
project              = { optional = true }
github-templates     = { optional = true }
agents               = { optional = true }

[features]
default  = []
docs     = ["dep:mdbook"]
publish  = ["dep:cargo-publish", "dep:github-release", "dep:project"]
binaries = ["dep:cargo-binaries", "dep:github-release"]
oss      = ["dep:project", "project/conduct", "dep:github-templates"]
nightly  = ["rust-lints/nightly", "dep:cargo-hack", "dep:github-nightly"]
strict   = ["cargo-deny/strict", "rust-lints/strict", "cargo-profiles/strict", "rust-doc/strict"]

# The agent layer, and the skill of every profile applied that has one.
agents = [
    "dep:agents",
    "cargo-deny/agents",
    "cargo-manifest/agents",
    "devset/agents",
    "git-commits/agents",
    "github-ci/agents",
    "rust-doc/agents",
    "github-release?/agents",
    "mdbook?/agents",
]
