[profile]
name        = "agents"
description = "What a coding agent reads to work in the repository: AGENTS.md, CLAUDE.md, and Claude Code's allow-list and Stop hook"
devset      = ">=0.5.0"

[features]
default = ["hook", "readability", "security"]
# Claude Code's hooks: a turn that changes the repository ends only once `just check` passes.
hook = []
# Skills for how prose and code read, in .claude/skills/.
readability = []
# The review-security pass, in .claude/skills/.
security = []

[requires]
just = {}

[scaffolds.claude]
unless = "CLAUDE.md"

[files."AGENTS.md"]
scope    = "block"
starter  = "AGENTS.starter.md"
template = true

[files."CLAUDE.md"]
scaffold = "claude"

[files.".claude/settings.json"]
scope    = "keys"
policy   = "merge"
template = true

[files.".claude/hooks/check.sh"]
executable = true
when       = { features = ["hook"] }

[files.".claude/skills/review-names/SKILL.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/review-security/SKILL.md"]
template = true
when     = { features = ["security"] }

[files.".claude/skills/review-security/references/attack-classes.md"]
template = true
when     = { features = ["security"] }

[files.".claude/skills/review-security/references/sources.md"]
template = true
when     = { features = ["security"] }

[files.".claude/skills/writing-prose/SKILL.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-prose/references/comments.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-prose/references/messages.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-prose/references/sources.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-prose/references/tells.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-readable-code/SKILL.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-readable-code/references/naming.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-readable-code/references/simplicity.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-readable-code/references/sources.md"]
template = true
when     = { features = ["readability"] }

[files.".claude/skills/writing-readable-code/references/structure.md"]
template = true
when     = { features = ["readability"] }
