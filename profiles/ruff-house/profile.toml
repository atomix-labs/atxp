[profile]
name        = "ruff-house"
description = "The house Ruff, the linter only: imports at the top, no unclosed files, documented methods"
devset      = ">=0.1"

[vars.line_width]
prompt  = "Line width, shared by the formatters and EditorConfig"
default = "100"

[files."ruff.toml"]
scope    = "keys"
policy   = "merge"
template = true

[files.".just/ruff.just"]

[files.".config/mise/conf.d/devset-ruff.toml"]

[files.".config/mise/mise.lock"]
scope = "keys"
