# Applies the bundle to every fixture and runs its checks, then every profile alone and all at once,
# with devset built from its main branch.
name: profiles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      # devset builds on nightly until its nightly-only lints leave the workspace.
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install --locked --git https://github.com/atomix-labs/devset devset
      - run: devset status --exit-code
      - run: just test-profiles
