# Runs every `test-*` recipe, with the devset release atxp pins: the collection's suite, every profile
# alone, then the bundle and every profile at once on each fixture; the setup stub's test; and the
# bundle from nothing, with no features and with every feature.
name: profiles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      - run: devset status --exit-code
      - run: just test
