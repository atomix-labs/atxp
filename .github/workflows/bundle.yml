# The rust bundle from nothing, each feature alone: applied to an empty repository, set up and checked
# as a new project is. Every pull request runs it with no features and with every feature, through
# `just test`; each feature alone waits for the night.
name: bundle

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        feature: [docs, agents, publish, binaries, oss, nightly, strict]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every tool any profile pins, from the cache `profiles` saves on the default branch.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: suite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/mise/**', 'profiles/**/.config/mise/**') }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.13
          cache: false
      - env:
          FEATURE: ${{ matrix.feature }}
        run: mise exec -- bash tests/bundle.sh "$FEATURE"
